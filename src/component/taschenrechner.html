<div>
    Input A: <input type="number" id="inputA" [(ngModel)]="inputA"><br>
    Input B: <input type="number" id="inputB" [(ngModel)]="inputB"><br>

    <br>
    <button id="add" type="button" (click)="add()">+</button> Works<br>
    <button id="subtract" type="button" (click)="subtract()">-</button> Bugged<br>
    <button id="multiply" type="button" (click)="multiply()">×</button> Not implemented<br>
    <br>

    Result: <input type="number" id="result" [value]="result" readonly><br>
</div>
