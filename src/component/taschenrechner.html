<div>
    Input A: <input type="number" id="inputA" [(ngModel)]="inputA"><br>
    Input B: <input type="number" id="inputB" [(ngModel)]="inputB"><br>

    <br>
    <button style="border: 2px solid #46e57b;" type="button" (click)="add()">+</button><br>
    <button style="border: 2px solid #e54646;" type="button" (click)="subtract()">-</button><br>
    <button style="border: 2px solid #8b8b92;" type="button" (click)="multiply()">×</button><br>
    <br>

    Result: <input type="number" id="result" [value]="result" readonly><br>
</div>
